<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贵州移动下卡查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            outline: none;
        }
        .input-group input:focus,
        .input-group select:focus {
            border-color: #667eea;
        }
        .preview {
            text-align: center;
            margin: 15px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
        }
        .preview strong {
            color: #333;
            letter-spacing: 1px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        #queryBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        #queryBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        #queryBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .apply-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .apply-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }
        .order-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        .order-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }
        .activate-btn {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }
        .activate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(67, 233, 123, 0.4);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }
        .result.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
        .result.error {
            display: block;
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
        .result.loading {
            display: block;
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #1565c0;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hint {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }
        .disclaimer {
            margin-top: 25px;
            padding: 15px;
            background: #fff3e0;
            border: 1px solid #ffcc80;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            color: #e65100;
        }
        .disclaimer p {
            margin: 4px 0;
            line-height: 1.5;
        }
        .disclaimer strong {
            color: #bf360c;
        }

        /* 激活号卡弹窗样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: modalSlideIn 0.3s ease-out;
        }
        @keyframes modalSlideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 12px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            width: auto;
            padding: 4px 8px;
            margin-top: 0;
            line-height: 1;
        }
        .modal-close:hover {
            color: #333;
        }
        .modal-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 6px;
            margin-top: 0;
            padding-right: 30px;
        }
        .modal-desc {
            color: #888;
            font-size: 13px;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .qr-wrapper {
            width: 240px;
            height: 240px;
            margin: 0 auto 16px;
            padding: 12px;
            background: white;
            border: 2px solid #eee;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-sizing: border-box;
        }
        .qr-wrapper img,
        .qr-wrapper canvas {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        .qr-input-group {
            margin-bottom: 12px;
        }
        .qr-input-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
            text-align: left;
        }
        .qr-input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .qr-input-group input:focus {
            border-color: #667eea;
        }
        .qr-gen-btn {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            padding: 10px;
            font-size: 14px;
            margin-top: 6px;
        }
        .qr-gen-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 12px rgba(67, 233, 123, 0.3);
        }
        .qr-content-display {
            margin-top: 10px;
            padding: 8px 10px;
            background: #f5f5f5;
            border-radius: 6px;
            font-size: 11px;
            color: #666;
            word-break: break-all;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>贵州移动下卡查询</h1>
        <p class="subtitle">输入6位数字，自动补全为18位身份证号</p>

        <div class="input-group">
            <label for="shortId">请输入6位地区码或18位身份证号</label>
            <input type="text" id="shortId" maxlength="18" placeholder="511602 或 511602000000000000" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="suitId">选择套餐</label>
            <select id="suitId">
                <option value="19747">小黔卡39元档 (19747)</option>
                <option value="19727">小黔卡49元档 (19727)</option>
                <option value="20069">AI家嘉享礼包169元 (20069)</option>
                <option value="20068">AI家嘉享礼包99元 (20068)</option>
                <option value="20047">AI家嘉享礼包79元 (20047)</option>
            </select>
        </div>

        <div class="preview">
            查询号码：<strong id="fullId">-</strong>
        </div>

        <button id="queryBtn" onclick="query()">查询</button>

        <button id="applyBtn" onclick="goApply()" class="apply-btn">去下卡</button>

        <button onclick="window.open('https://wap.gz.10086.cn/smphone/simcard/quarSimOrderByCond.do','_blank')" class="order-btn">查询下卡订单</button>

        <button onclick="openActivateModal()" class="activate-btn">激活号卡</button>

        <div id="result" class="result"></div>

        <p class="hint">提示：输入6位地区码自动补0，或直接输入18位完整身份证号</p>

        <div class="disclaimer">
            <p><strong>免责声明</strong></p>
            <p>本工具仅供学习测试和技术交流使用，请勿用于任何非法用途。</p>
            <p>使用本工具所产生的一切后果由使用者自行承担，与开发者无关。</p>
        </div>
    </div>

    <!-- 激活号卡弹窗 -->
    <div id="activateModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeActivateModal()" aria-label="关闭">✕</button>
            <h2 class="modal-title">激活号卡</h2>
            <p class="modal-desc">请使用中国移动App扫描下方二维码完成激活</p>
            <div class="qr-wrapper">
                <canvas id="qrCanvas"></canvas>
            </div>
            <div class="qr-input-group">
                <label for="qrInput">自定义二维码内容（可选）</label>
                <input type="text" id="qrInput" placeholder="输入激活码/号码/链接，点击生成" maxlength="200">
            </div>
            <button class="qr-gen-btn" onclick="generateQR()">生成二维码</button>
            <div id="qrContent" class="qr-content-display" style="display:none;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script>
        const shortIdInput = document.getElementById('shortId');
        const suitIdSelect = document.getElementById('suitId');
        const fullIdDisplay = document.getElementById('fullId');
        const queryBtn = document.getElementById('queryBtn');
        const resultDiv = document.getElementById('result');

        function processID(input) {
            input = input.replace(/\D/g, '');
            if (input.length === 6) {
                return input.padEnd(18, '0');
            } else if (input.length === 18) {
                return input;
            }
            return input;
        }

        shortIdInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            e.target.value = value;

            if (value.length > 0) {
                const processed = processID(value);
                if (value.length === 6) {
                    fullIdDisplay.innerHTML = processed + ' <span style="color:#999;font-size:12px;">(自动补0)</span>';
                } else if (value.length === 18) {
                    fullIdDisplay.innerHTML = processed + ' <span style="color:#4caf50;font-size:12px;">(完整号码)</span>';
                } else {
                    fullIdDisplay.textContent = processed;
                }
            } else {
                fullIdDisplay.textContent = '-';
            }
        });

        async function query() {
            const shortId = shortIdInput.value.trim();

            if (shortId.length === 0) {
                showResult('error', '请输入6位地区码或18位身份证号');
                return;
            }

            if (shortId.length !== 6 && shortId.length !== 18) {
                showResult('error', '请输入6位地区码或完整的18位身份证号');
                return;
            }

            const fullId = processID(shortId);
            const suitId = suitIdSelect.value;

            queryBtn.disabled = true;
            showResult('loading', '<span class="spinner"></span>查询中，请稍候...');

            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ idCard: fullId, suitId: suitId })
                });

                const data = await response.json();

                if (data.error) {
                    showResult('error', '查询失败：' + data.error);
                } else {
                    const statusClass = data.canApply ? 'success' : 'error';
                    const statusIcon = data.canApply ? '✓' : '✗';
                    let resultHTML = `<div style="font-size: 24px; margin-bottom: 15px;">${statusIcon} ${data.status}</div>`;
                    resultHTML += '<div style="font-size: 12px; color: #666; margin-top: 10px;">';
                    resultHTML += '<b>原始返回:</b><br>';
                    for (const [key, value] of Object.entries(data.raw || {})) {
                        resultHTML += `${key}: ${value}<br>`;
                    }
                    resultHTML += '</div>';
                    showResult(statusClass, resultHTML);
                }
            } catch (err) {
                showResult('error', '网络错误，请检查后端服务是否启动');
            } finally {
                queryBtn.disabled = false;
            }
        }

        function goApply() {
            const suitId = suitIdSelect.value;
            const url = `https://wap.gz.10086.cn/smphone/newSimcard/checkNumber.do?suit_type=117&simcard_suit_id=${suitId}`;
            window.open(url, '_blank');
        }

        function showResult(type, message) {
            resultDiv.className = 'result ' + type;
            resultDiv.innerHTML = message;
        }

        shortIdInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                query();
            }
        });

        // ========== 激活号卡二维码功能 ==========
        function openActivateModal() {
            document.getElementById('activateModal').classList.add('active');
            // 弹窗打开时立即生成默认二维码
            generateDefaultQR();
        }

        function closeActivateModal() {
            document.getElementById('activateModal').classList.remove('active');
        }

        // 点击遮罩关闭弹窗
        document.getElementById('activateModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeActivateModal();
            }
        });

        function renderQRCode(text) {
            try {
                const canvas = document.getElementById('qrCanvas');
                if (!canvas) return;

                if (typeof qrcode !== 'function') {
                    const ctx = canvas.getContext('2d');
                    canvas.width = 400;
                    canvas.height = 400;
                    canvas.style.width = '100%';
                    canvas.style.height = '100%';
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, 400, 400);
                    ctx.fillStyle = '#333';
                    ctx.font = '16px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('二维码库加载失败，请检查网络', 200, 200);
                    return;
                }

                const qr = qrcode(0, 'M');
                qr.addData(text);
                qr.make();

                // 使用较高的内部分辨率（400x400），由 CSS 缩放到容器大小
                const targetSize = 400;
                const modules = qr.getModuleCount();
                const cellSize = Math.floor(targetSize / modules);
                const actualSize = modules * cellSize;

                canvas.width = actualSize;
                canvas.height = actualSize;
                canvas.style.width = '100%';
                canvas.style.height = '100%';
                canvas.style.display = 'block';

                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, actualSize, actualSize);
                ctx.fillStyle = '#000000';

                for (let row = 0; row < modules; row++) {
                    for (let col = 0; col < modules; col++) {
                        if (qr.isDark(row, col)) {
                            ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                        }
                    }
                }

                const contentDiv = document.getElementById('qrContent');
                if (contentDiv) {
                    contentDiv.style.display = 'block';
                    contentDiv.textContent = '二维码内容: ' + text;
                }
            } catch (err) {
                const canvas = document.getElementById('qrCanvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                canvas.width = 400;
                canvas.height = 400;
                canvas.style.width = '100%';
                canvas.style.height = '100%';
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, 400, 400);
                ctx.fillStyle = '#c62828';
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('生成失败：' + (err.message || '未知错误'), 200, 200);
            }
        }

        function generateDefaultQR() {
            renderQRCode('https://wap.gz.10086.cn/smphone/simcard/quarSimOrderByCond.do');
        }

        function generateQR() {
            const input = document.getElementById('qrInput').value.trim();
            if (!input) {
                generateDefaultQR();
                return;
            }
            renderQRCode(input);
        }

        // ESC键关闭弹窗
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeActivateModal();
            }
        });
    </script>
</body>
</html>
