<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贵州移动下卡查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            outline: none;
        }
        .input-group input:focus,
        .input-group select:focus {
            border-color: #667eea;
        }
        .preview {
            text-align: center;
            margin: 15px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
        }
        .preview strong {
            color: #333;
            letter-spacing: 1px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        #queryBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        #queryBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        #queryBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .apply-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .apply-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }
        .order-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        .order-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }
        .activate-btn {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }
        .activate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(67, 233, 123, 0.4);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }
        .result.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
        .result.error {
            display: block;
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
        .result.loading {
            display: block;
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #1565c0;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hint {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }
        .disclaimer {
            margin-top: 25px;
            padding: 15px;
            background: #fff3e0;
            border: 1px solid #ffcc80;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            color: #e65100;
        }
        .disclaimer p {
            margin: 4px 0;
            line-height: 1.5;
        }
        .disclaimer strong {
            color: #bf360c;
        }
    </style>
</head>

    <script>
        const shortIdInput = document.getElementById('shortId');
        const suitIdSelect = document.getElementById('suitId');
        const fullIdDisplay = document.getElementById('fullId');
        const queryBtn = document.getElementById('queryBtn');
        const resultDiv = document.getElementById('result');

        // 处理输入号码
        function processID(input) {
            input = input.replace(/\D/g, '');
            if (input.length === 6) {
                return input.padEnd(18, '0');
            } else if (input.length === 18) {
                return input;
            }
            return input;
        }

        // 输入处理
        shortIdInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            e.target.value = value;

            if (value.length > 0) {
                const processed = processID(value);
                if (value.length === 6) {
                    fullIdDisplay.innerHTML = processed + ' <span style="color:#999;font-size:12px;">(自动补0)</span>';
                } else if (value.length === 18) {
                    fullIdDisplay.innerHTML = processed + ' <span style="color:#4caf50;font-size:12px;">(完整号码)</span>';
                } else {
                    fullIdDisplay.textContent = processed;
                }
            } else {
                fullIdDisplay.textContent = '-';
            }
        });

        // 查询函数
        async function query() {
            const shortId = shortIdInput.value.trim();

            if (shortId.length === 0) {
                showResult('error', '请输入6位地区码或18位身份证号');
                return;
            }

            if (shortId.length !== 6 && shortId.length !== 18) {
                showResult('error', '请输入6位地区码或完整的18位身份证号');
                return;
            }

            const fullId = processID(shortId);
            const suitId = suitIdSelect.value;

            queryBtn.disabled = true;
            showResult('loading', '<span class="spinner"></span>查询中，请稍候...');

            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ idCard: fullId, suitId: suitId })
                });

                const data = await response.json();

                if (data.error) {
                    showResult('error', '查询失败：' + data.error);
                } else {
                    const statusClass = data.canApply ? 'success' : 'error';
                    const statusIcon = data.canApply ? '✓' : '✗';
                    let resultHTML = `<div style="font-size: 24px; margin-bottom: 15px;">${statusIcon} ${data.status}</div>`;
                    resultHTML += '<div style="font-size: 12px; color: #666; margin-top: 10px;">';
                    resultHTML += '<b>原始返回:</b><br>';
                    for (const [key, value] of Object.entries(data.raw || {})) {
                        resultHTML += `${key}: ${value}<br>`;
                    }
                    resultHTML += '</div>';
                    showResult(statusClass, resultHTML);
                }
            } catch (err) {
                showResult('error', '网络错误，请检查后端服务是否启动');
            } finally {
                queryBtn.disabled = false;
            }
        }

        // 去下卡
        function goApply() {
            const suitId = suitIdSelect.value;
            const url = `https://wap.gz.10086.cn/smphone/newSimcard/checkNumber.do?suit_type=117&simcard_suit_id=${suitId}`;
            window.open(url, '_blank');
        }

        // 显示结果
        function showResult(type, message) {
            resultDiv.className = 'result ' + type;
            resultDiv.innerHTML = message;
        }

        // 回车键触发查询
        shortIdInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                query();
            }
        });
    </script>
</body>
</html>
